# AQspace services: the Python worker (notes-ai), the Node API and web app (aq-api),
# and an optional Cloudflare tunnel. Start with `docker compose up --build`.
#
# All state is bind-mounted under this repository (no named volumes), so
# scripts/nuke.sh can remove everything.
name: aqspace                             # fixed project name so cleanup finds everything

services:
  # Python worker: transcripts, AI notes and PDF rendering. It listens on
  # 127.0.0.1:5055 inside its own network namespace, so 5055 is never reachable
  # from the host. aq-api and the tunnel share this namespace, which is why
  # aq-api's port 5180 is published on this service.
  notes-ai:
    build: ./apps/worker
    env_file: ./apps/worker/backend/.env   # AI provider keys; never baked into the image
    environment:
      # Optional local model: llama-server running natively on the host at port 8081.
      LNAI_LOCAL_URL: http://host.docker.internal:8081/v1
      LNA_PROVIDER_FALLBACK: "1"              # fall back to Groq (videos up to 1 h) when the local model is down
      # The image installs notes_engine into site-packages, so its default Whisper
      # directory (.tools/whisper-models, relative to the repo) would sit outside any
      # mount. Point it at the bind mount below instead.
      LNAI_WHISPER_DIR: /app/.tools/whisper-models
      LNA_CACHE_DIR: /app/backend/output/cache  # notes cache lives under the output bind mount
      LNA_TMP_DIR: /app/backend/.tmp            # scratch audio and PDF browser profiles
      # NVIDIA_API_KEY, COLAB_LLM_URL and COLAB_LLM_KEY belong in apps/worker/backend/.env only.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5180:5180"             # aq-api (web app and API)
    volumes:
      - ./apps/worker/backend/output:/app/backend/output   # generated notes stay in the repo
      - ./apps/worker/backend/.tmp:/app/backend/.tmp       # scratch audio and PDF browser profiles (LNA_TMP_DIR)
      - ./.tools/whisper-models:/app/.tools/whisper-models      # Whisper model survives rebuilds
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/api/providers', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Node/Express API with SQLite. Serves the web app and talks to notes-ai over loopback.
  aq-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    network_mode: "service:notes-ai"
    environment:
      PY_NOTES_URL: http://127.0.0.1:5055
      PY_NOTES_PROVIDER: ${PY_NOTES_PROVIDER:-gemini}   # gemini (fast, cloud) | local (llama-server on the host) | groq
      TUNNEL_ORIGINS: https://*.trycloudflare.com   # pages served through the tunnel may write
      PY_SMART_PROVIDER: ${PY_SMART_PROVIDER:-gemini}   # provider for "Smart arrange" (its key goes in apps/worker/backend/.env)
      # Developer tracker at /dev (request and event logs in apps/api/data/devlogs).
      # On by default for local work; aq-api always refuses /dev for requests that
      # arrive through the tunnel. Set AQ_DEV_TOOLS=0 in your shell to turn it off.
      AQ_DEV_TOOLS: ${AQ_DEV_TOOLS:-1}
      AQ_RUN_DIR: ""                                    # empty: /dev does not tail .run/ logs (there are none inside the container)
      TRUST_CF_HEADERS: "1"                         # rate-limit per visitor via CF-Connecting-IP (only trusted from the loopback tunnel)
      # Sign-in settings come from the root .env, never from this file.
      # Without a .env the app runs as a single local user.
      AUTH_MODE: ${AUTH_MODE:-local}                    # local | google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5180/api/v1/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - ./apps/api/data:/app/api/data    # SQLite database (aq.db) stays in the repo
    depends_on:
      notes-ai:
        condition: service_healthy

  # Public HTTPS link to the app on port 5180. Opt-in: docker compose --profile tunnel up
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    profiles: ["tunnel"]
    network_mode: "service:notes-ai"      # same loopback as aq-api
    command: tunnel --no-autoupdate --url http://127.0.0.1:5180 --http-host-header localhost:5180
    depends_on:
      - aq-api
