name: aqspace                             # fixed project name so cleanup finds everything

# Three services on one Docker network. Services reach each other by name (db, backend).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./.data/pgdata:/var/lib/postgresql/data   # data lives inside the repo (gitignored)
    healthcheck:                          # backend waits until Postgres is really ready
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env                        # Google keys + session secret
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
    ports:
      - "4000:4000"                       # exposed so Postman can hit it directly
    volumes:
      - ./backend:/app                    # live-reload on code change
      - /app/node_modules                 # keep container's node_modules, not host's
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Lecture Notes AI (Python worker). Binds 127.0.0.1:5055 inside its own network namespace,
  # so 5055 is never reachable from the host. aq-api shares this namespace, which is why
  # aq-api's port 5180 is published here.
  notes-ai:
    build: ./lecture-notes-ai
    env_file: ./lecture-notes-ai/backend/.env   # GROQ_API_KEY etc. (never baked into the image)
    ports:
      - "127.0.0.1:5180:5180"             # aq-api (notes app UI + API)
    volumes:
      - ./lecture-notes-ai/backend/output:/app/backend/output   # generated notes stay in the repo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/api/providers', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # aq-api (Node/Express + SQLite) serves the notes UI and talks to notes-ai over loopback.
  aq-api:
    build:
      context: .
      dockerfile: aq-api/Dockerfile
    network_mode: "service:notes-ai"
    environment:
      PY_NOTES_URL: http://127.0.0.1:5055
      PY_NOTES_PROVIDER: groq
      TUNNEL_ORIGINS: https://*.trycloudflare.com   # pages served through the tunnel may write
    volumes:
      - ./aq-api/data:/app/aq-api/data    # SQLite aq.db stays in the repo (gitignored)
    depends_on:
      notes-ai:
        condition: service_healthy

  # Public link to the UI (aq-api :5180). Opt-in: docker compose --profile tunnel up
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    profiles: ["tunnel"]
    network_mode: "service:notes-ai"      # same loopback as aq-api
    command: tunnel --no-autoupdate --url http://127.0.0.1:5180 --http-host-header localhost:5180
    depends_on:
      - aq-api
