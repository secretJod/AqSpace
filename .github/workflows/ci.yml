name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: api (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install and test
        working-directory: apps/api
        run: |
          npm ci
          npm test

  web:
    name: web (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --check
        run: find apps/web -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check

  worker:
    name: worker (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml
      - name: Install
        run: pip install -e "apps/worker[web,dev]"
      # Ubuntu 24.04 runners block unprivileged user namespaces via AppArmor,
      # which breaks Chrome's sandbox (used by the PDF tests). Re-allow them.
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # tests/ = notes_engine + Flask API; demo/ = model evaluation (notes_eval) tests.
      - name: Test
        working-directory: apps/worker
        env:
          LNA_OFFLINE: "1"
        run: python -m pytest tests demo -q
