<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your playlists - AQspace</title>
    <meta
      name="description"
      content="Your lecture playlists: collect YouTube lectures, watch them in order and turn them into hand-drawn notes."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff'/%3E%3Ctext x='16' y='22' font-size='16' font-family='serif' font-weight='bold' text-anchor='middle' fill='%23000'%3EAQ%3C/text%3E%3C/svg%3E"
    />
    <!-- Styles. Order matters: later files may override earlier ones. styles.css is the base for the whole app. -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/smart-magic.css" />
    <link rel="stylesheet" href="css/streak.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/goals.css" />
    <link rel="stylesheet" href="css/sticky-board.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <link rel="stylesheet" href="css/neural.css" />
    <link rel="stylesheet" href="css/hud.css" />
    <link rel="stylesheet" href="css/expand.css" />
    <link rel="stylesheet" href="css/achievements.css" />
    <link rel="stylesheet" href="css/mirror.css" />
    <!-- AQspace: profile button + menu, sign-in and expired-session screens -->
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>

    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <div class="topbar__in">
        <a class="logo" href="#/" aria-label="AQspace - playlists">
          <span class="logo__mark" aria-hidden="true">AQ</span>
          <span class="logo__text">AQspace</span>
        </a>
        <form class="search" id="search-form" role="search" autocomplete="off">
          <label class="sr" for="search">Search playlists by name</label>
          <svg class="icon search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-4.3-4.3"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <input
            id="search"
            type="search"
            name="q"
            placeholder="Search playlists"
            maxlength="60"
            enterkeyhint="search"
          />
        </form>
        <span class="avatar" role="img" aria-label="Your account">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 3a4 4 0 100 8 4 4 0 000-8z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </div>
    </header>

    <div class="banner" id="storage-warning" role="status" hidden>
      Browser storage is unavailable, so your changes will be lost when you close this tab.
    </div>

    <!-- ===== SCREEN (rendered by app.js: #/ playlists, #/playlist/<id> detail) ===== -->
    <main class="wrap" id="view" tabindex="-1"></main>

    <p class="sr" id="live" aria-live="polite"></p>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- ===== MODAL (player / notes / forms / confirm) ===== -->
    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <button class="modal__close" type="button" data-close aria-label="Close dialog">&times;</button>
        <p class="eyebrow" id="modal-kind"></p>
        <h2 class="modal__title" id="modal-title"></h2>
        <div class="modal__body" id="modal-body"></div>
      </div>
    </div>

    <!-- Scripts. Every file adds one piece to the global `AQ` object, so the ORDER below matters:
       a file may only use pieces from files listed above it. See README.md, "Load order". -->

    <!-- 1. Core: helpers, data store, server sync (no screens) -->
    <script src="js/core/demo-cleanup.js"></script>
    <script src="js/core/util.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/features/profile/profile.js"></script>

    <!-- 2. Shared UI pieces and features -->
    <script src="js/ui/dialog.js"></script>
    <script src="js/features/notes/notes-jobs.js"></script>
    <script src="js/features/notes/note-button.js"></script>
    <script src="js/features/notes/notes-view.js"></script>
    <script src="js/features/player/player.js"></script>
    <script src="js/ui/water-button.js"></script>
    <script src="js/ui/click-spark.js"></script>
    <script src="js/features/smart/smart-magic.js"></script>
    <script src="js/features/playlists/split-view.js"></script>
    <script src="js/features/playlists/import-playlist.js"></script>
    <script src="js/features/smart/smart-arrange.js"></script>
    <!-- motion effects + the card -> panel expand (used by the streak card and the dashboard) -->
    <script src="js/features/dashboard/motion.js"></script>
    <script src="js/features/dashboard/neural.js"></script>
    <script src="js/features/dashboard/hud.js"></script>
    <script src="js/features/dashboard/expand.js"></script>
    <script src="js/features/streak/streak.js"></script>
    <script src="js/features/achievements/achievements.js"></script>
    <script src="js/features/navbar/navbar.js"></script>

    <!-- 2b. Dashboard: the vendored chart library first (no CDNs: the CSP only allows our own scripts),
       then activity data + hooks, goals, chart helpers and finally the dashboard screen that uses them all. -->
    <script src="js/vendor/chart.umd.js"></script>
    <script src="js/features/dashboard/activity-log.js"></script>
    <script src="js/features/dashboard/activity-hooks.js"></script>
    <script src="js/features/dashboard/goals.js"></script>
    <script src="js/features/dashboard/charts.js"></script>
    <script src="js/features/dashboard/hud-metrics.js"></script>
    <script src="js/features/dashboard/hud-gauges.js"></script>
    <script src="js/features/dashboard/sticky-board.js"></script>
    <script src="js/features/dashboard/dashboard.js"></script>

    <!-- 3. The app: routing + screens. Loaded last because it uses everything above. -->
    <div id="navbar-root"></div>
    <script src="js/app.js"></script>
  </body>
</html>
