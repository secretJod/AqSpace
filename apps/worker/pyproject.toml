[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-notes-ai"
version = "0.1.0"
description = "Turn a YouTube lecture into hand-drawn 'field notebook' study notes (PDF + HTML) with the AI provider of your choice."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lecture Notes AI contributors" }]
keywords = ["youtube", "lecture", "notes", "study", "llm", "pdf", "transcript"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
    "youtube-transcript-api>=1.0",
    "yt-dlp",
    "pymupdf",
]

[project.optional-dependencies]
web = ["flask>=3.0", "flask-cors>=4.0", "python-dotenv>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]
# Local speech-to-text for videos without captions (CPU int8). The model downloads on first use
# into <repo>/.tools/whisper-models; imageio-ffmpeg ships a static ffmpeg into the venv.
whisper = ["faster-whisper>=1.0", "imageio-ffmpeg>=0.5"]

[project.scripts]
lecture-notes = "notes_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["notes_engine*"]

[tool.setuptools.package-data]
notes_engine = ["templates/*", "templates/vendor/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notes_engine/templates/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # The renderer builds HTML and SVG with printf-style templates, where "%d" deliberately
    # truncates float sizes and coordinates; a mechanical rewrite to f-strings would change output.
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
# Prompt texts keep one paragraph per line: the line breaks are part of what the model reads.
"notes_engine/prompts.py" = ["E501"]
"notes_engine/smart_playlist.py" = ["E501"]
"tools/notes_eval/evaluate.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["notes_engine", "app", "tools"]
